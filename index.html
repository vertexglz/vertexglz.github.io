<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой первый сайт</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            padding: 30px;
        }

        h1 {
            font-size: 42px;
        }

        p {
            color: #9ca3af;
            font-size: 18px;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Привет! Это мой сайт 🚀</h1>
        <p>Добро пожаловать на мою первую веб-страницу.</p>

        <button onclick="alert('Всё работает!')">
            Нажми меня
        </button>
    </div>
</body>
</html>
